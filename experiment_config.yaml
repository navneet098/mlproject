random_seed: 42
dataset:
  name: UCI Individual Household Electric Power Consumption
  url: https://archive.ics.uci.edu/dataset/235/individual+household+electric+power+consumption
  target: Global_active_power
  aggregation: hourly_mean
split:
  train: 0.70
  validation: 0.15
  test: 0.15
forecasting:
  models:
    - previous_day_same_hour
    - linear_regression
    - random_forest
  random_forest:
    n_estimators: 250
    max_depth: 18
    min_samples_leaf: 2
anomaly_detection:
  rolling_mad:
    window_hours: 168
    threshold: 3.5
  isolation_forest:
    n_estimators: 250
    contamination: 0.01
